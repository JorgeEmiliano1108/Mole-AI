name: MS3 Reports CI

on:
  push:
    branches: [main, develop]
    paths:
      - "microservices/mole_report/**"
  pull_request:
    paths:
      - "microservices/mole_report/**"

defaults:
  run:
    working-directory: microservices/mole_report

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[dev]" || pip install -r requirements.txt
      - run: pip install ruff
      - run: ruff check app/ application/ infrastructure/ domain/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update && sudo apt-get install -y \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-xlib-2.0-0 shared-mime-info
      - run: pip install -r requirements.txt pytest pytest-cov httpx
      - run: pytest tests/ --cov=app --cov=application --cov=infrastructure --cov=domain --cov-fail-under=80
        env:
          MS3_REDIS_URL: redis://localhost:6379/2
          JWT_SECRET_KEY: test-secret-12345

  license-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pip-licenses
      - run: pip-licenses --fail-on="GPL;LGPL;AGPL;GPLv2;GPLv3;LGPLv2;LGPLv3"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f microservices/mole_report/Dockerfile --target production -t mole-report:latest microservices/mole_report
