version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
  ms3:
    build: .
    ports:
      - "8003:8003"
    environment:
      MS3_REDIS_URL: redis://redis:6379
      MS3_S3_ENDPOINT: http://minio:9000
      MS3_S3_ACCESS_KEY: minioadmin
      MS3_S3_SECRET_KEY: minioadmin
      MS3_S3_BUCKET: reports
    depends_on:
      - redis
      - minio
