networks:
  mole-ai-net:
    driver: bridge

services:
  # --- BACKEND (Django "Pip-Boy") ---
  django_backend:
    build: .
    container_name: django_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG}
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - SUPABASE_DB_HOST=${SUPABASE_DB_HOST}
      - SUPABASE_DB_PORT=${SUPABASE_DB_PORT}
      - REDIS_URL=${REDIS_URL}
      - FASTAPI_URL=${FASTAPI_URL}
      - MOLE_AI_API_KEY=${MOLE_AI_API_KEY}
      - MOLE_AI_TIMEOUT=${MOLE_AI_TIMEOUT}
      - HARDWARE_API_KEY=${HARDWARE_API_KEY}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      fastapi_rag:
        condition: service_healthy
      mqtt_broker:
        condition: service_started
    networks:
      - mole-ai-net

  # --- AI SERVICE (FastAPI "Cerebro") ---
  fastapi_rag:
    build: ./ms2_rag_cag_service
    container_name: fastapi_rag
    expose:
      - "8002"  # M4: internal only, no host exposure
    volumes:
      - ./ms2_rag_cag_service:/app/ms2_rag_cag_service
      - ai_rag_vectors:/app/storage/vectors
      - ./models:/models:ro            # CNN .tflite + labels.json (read-only)
    env_file:
      - .env
    environment:
      - PORT=${PORT}
      - HOST=${HOST}
      - API_PORT=${API_PORT}
      - VECTOR_DB_PATH=${VECTOR_DB_PATH}
      - REDIS_URL=${REDIS_URL}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - MOLE_AI_API_KEY=${MOLE_AI_API_KEY}
      - HARDWARE_API_KEY=${HARDWARE_API_KEY}
      - LLM_MODEL_ID=${LLM_MODEL_ID}
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID}
      - VISION_MODEL_NAME=${VISION_MODEL_NAME}
      - VISION_BACKEND=${VISION_BACKEND}
      - CNN_MODEL_PATH=${CNN_MODEL_PATH}
      - CNN_LABELS_PATH=${CNN_LABELS_PATH}
      - OOD_MODEL_PATH=${OOD_MODEL_PATH}
      - OOD_THRESHOLD=${OOD_THRESHOLD}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/v1/health')"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5
    networks:
      - mole-ai-net

  # --- DATABASE (Postgres + pgvector) ---
  db:
    image: pgvector/pgvector:pg16
    container_name: mole_ai_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    expose:
      - "5432"  # M4: internal only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mole-ai-net

  # --- CACHE (Redis) ---
  redis:
    image: redis:7-alpine
    container_name: mole_ai_redis
    expose:
      - "6379"  # M4: internal only
    networks:
      - mole-ai-net

  # --- MQTT BROKER (Eclipse Mosquitto) ---
  mqtt_broker:
    image: eclipse-mosquitto:2
    container_name: mqtt_broker
    expose:
      - "1883"  # M4: internal only
      - "9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - mole-ai-net
  # --- MINIO (S3-compatible) ---
  minio:
    image: minio/minio:latest
    container_name: mole_ai_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data
    expose:
      - "9000"  # M4: internal only
    volumes:
      - minio_data:/data
    networks:
      - mole-ai-net

  # --- MS1: Vision ---
  ms1_vision:
    build: ./ms1_vision
    container_name: ms1_vision
    expose:
      - "8001"  # M4: internal only, no host exposure
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
    depends_on:
      - db
      - redis
      - minio
    networks:
      - mole-ai-net

  # --- MS2: Chat / RAG (ms2_rag_cag_service) ---
  ms2_chat:
    build: ./ms2_rag_cag_service
    container_name: ms2_chat
    expose:
      - "8002"  # M4: internal only
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
    depends_on:
      - db
      - redis
      - minio
    networks:
      - mole-ai-net

  # --- MS3: Reports (FastAPI) ---
  ms3_reports:
    build: ./ms3_reports
    container_name: ms3_reports
    expose:
      - "8003"  # M4: internal only
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - MS3_S3_ENDPOINT=${MS3_S3_ENDPOINT}
      - MS3_S3_ACCESS_KEY=${MS3_S3_ACCESS_KEY}
      - MS3_S3_SECRET_KEY=${MS3_S3_SECRET_KEY}
      - MS3_S3_BUCKET=${MS3_S3_BUCKET}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
      - minio
      - db
    networks:
      - mole-ai-net

  # --- MS3: Celery worker ---
  ms3_celery_worker:
    build: ./ms3_reports
    container_name: ms3_celery_worker
    command: ["celery", "-A", "infrastructure.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL}
      - MS3_S3_ENDPOINT=${MS3_S3_ENDPOINT}
      - MS3_S3_ACCESS_KEY=${MS3_S3_ACCESS_KEY}
      - MS3_S3_SECRET_KEY=${MS3_S3_SECRET_KEY}
      - MS3_S3_BUCKET=${MS3_S3_BUCKET}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - ms3_reports
      - redis
      - db
    networks:
      - mole-ai-net

volumes:
  postgres_data:
  ai_rag_vectors:
  minio_data:
