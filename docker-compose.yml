# version: '3.8' # Obsoleto en Docker Compose moderno

services:
  postgres:
    image: postgres:15-alpine
    container_name: mole_ai_postgres_hex
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mole_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-mole_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mole_pass_2026}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts-hex:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - mole_ai_hex_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mole_user} -d ${POSTGRES_DB:-mole_ai_db}"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mole_ai_pgadmin_hex
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mole-ai-hex.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_2026_hex}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-config-hex/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    networks:
      - mole_ai_hex_network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - admin

  # Opcional: Ollama para Phi-3.5 si se prefiere despliegue externo
  ollama:
    image: ollama/ollama:latest
    container_name: mole_ai_ollama_hex
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks:
      - mole_ai_hex_network
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - ollama

  # Servicio FastAPI para IA (Phi-3.5)
  ai-vision-service:
    build:
      context: ./ai_vision_service
      dockerfile: Dockerfile
    container_name: mole_ai_vision_service
    ports:
      - "${AI_SERVICE_PORT:-8001}:8000"
    volumes:
      - ./ai_vision_service:/app
      - ./storage:/app/storage
      - ./logs:/app/logs
    environment:
      - MODEL_NAME=${MODEL_NAME:-microsoft/Phi-3.5-vision-instruct}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5433
      - POSTGRES_DB=${POSTGRES_DB:-mole_ai_db}
      - POSTGRES_USER=${POSTGRES_USER:-mole_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mole_pass_2026}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mole_ai_hex_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  # Servicio Django Backend Principal
  django-backend:
    build:
      context: ./backend_django
      dockerfile: Dockerfile
    container_name: mole_ai_django_backend
    ports:
      - "${DJANGO_PORT:-8002}:8000"
    volumes:
      - ./backend_django:/app
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./media:/app/media
    environment:
      - DEBUG=${DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mole_user}:${POSTGRES_PASSWORD:-mole_pass_2026}@postgres:5432/${POSTGRES_DB:-mole_ai_db}
      - AI_SERVICE_URL=http://ai-vision-service:8000
      - ALLOWED_HOSTS=localhost,127.0.0.1,django-backend,${ALLOWED_HOSTS:-}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,${CORS_ALLOWED_ORIGINS:-}
      - MEDIA_ROOT=/app/media
      - STATIC_ROOT=/app/static
    depends_on:
      postgres:
        condition: service_healthy
      ai-vision-service:
        condition: service_healthy
    networks:
      - mole_ai_hex_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/admin/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "

  # Nginx reverse proxy opcional para producción
  nginx:
    image: nginx:alpine
    container_name: mole_ai_nginx_hex
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx-hex/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-hex/ssl:/etc/nginx/ssl:ro
      - ./storage:/var/www/storage:ro
    depends_on:
      - django-backend
      - ai-vision-service
    networks:
      - mole_ai_hex_network
    restart: unless-stopped
    profiles:
      - production

# Volumes persistentes
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  ollama_data:
    driver: local

# Red interna dedicada a arquitectura hexagonal
networks:
  mole_ai_hex_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16