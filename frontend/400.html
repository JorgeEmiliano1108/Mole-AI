<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLE-IA | 400 - Error de Sintaxis</title>
    <!-- Incluir fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    
    <!-- Script temporal de Tailwind en caso de que no se haya compilado -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { 
                mono: ['"JetBrains Mono"', 'monospace'],
                sans: ['Inter', 'sans-serif']
            }
          }
        }
      }
    </script>
</head>
<body class="bg-[#0b1011] text-gray-300 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Tarjeta principal -->
    <div class="bg-[#131b1a] border border-[#2a3f3a] rounded-xl p-8 sm:p-12 max-w-2xl w-full shadow-[0_0_30px_rgba(0,0,0,0.5)] flex flex-col items-center text-center relative overflow-hidden">
        
        <!-- Glow Sutil de Fondo (Opcional, inspirado en la imagen) -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-32 bg-[#2ee59d] opacity-[0.03] blur-3xl rounded-full pointer-events-none"></div>

        <!-- Logo/Icono Central -->
        <div class="mb-6 flex justify-center items-center relative">
            <!-- Simulación del icono SVG de la hoja de la imagen -->
            <svg class="w-16 h-16 text-[#2ee59d]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <!-- Una representación minimalista de la hoja con el círculo -->
                <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke-width="1" class="text-[#2ee59d] opacity-40"></path>
                <path d="M12 21.5C12 21.5 5 16 5 10C5 6.5 8 4 12 4C16 4 19 6.5 19 10C19 16 12 21.5 12 21.5Z"></path>
                <path d="M12 21.5V10"></path>
                <!-- Línea superior como la del logo -->
                <line x1="8" y1="2" x2="16" y2="2" stroke-width="2" class="text-[#8b9b96]"></line>
            </svg>
        </div>

        <!-- Títulos -->
        <h1 class="text-2xl sm:text-3xl font-bold text-[#ff8a75] mb-4 font-sans tracking-wide">400 - Error de Sintaxis de Datos</h1>
        <p class="text-[#a1b0ab] text-sm sm:text-base max-w-lg mb-8 leading-relaxed">
            El sistema no pudo procesar la solicitud debido a un error en el<br class="hidden sm:block"> envío de datos desde el sensor o la interfaz.
        </p>

        <!-- Terminal Box -->
        <div class="bg-[#0c1211] border border-[#1b2624] rounded-md w-full p-5 mb-10 text-left text-xs sm:text-sm font-mono shadow-inner overflow-x-auto">
            <div class="space-y-2.5">
                <div class="flex gap-3">
                    <span class="text-[#ff8a75] font-bold shrink-0">[ERR]</span> 
                    <span class="text-[#8b9b96]">SYS_RECV: Malformed payload detected.</span>
                </div>
                <div class="flex gap-3">
                    <span class="text-[#2ee59d] font-bold shrink-0">[NFO]</span> 
                    <span class="text-[#8b9b96]">DATA_NODE: Awaiting structural validation...</span>
                </div>
                <div class="flex gap-3">
                    <span class="text-[#ff8a75] font-bold shrink-0">[ERR]</span> 
                    <span class="text-[#8b9b96]">CONNECTION_STATE: Data syntax rejected.</span>
                </div>
            </div>
        </div>

        <!-- Botones -->
        <div class="w-full flex flex-col sm:flex-row justify-center items-center gap-6 sm:gap-10 font-mono text-xs sm:text-[13px]">
            
            <!-- Botón Reiniciar Sesión -->
            <button onclick="window.location.reload()" class="flex items-center gap-2.5 border border-[#2ee59d] text-[#2ee59d] hover:bg-[#2ee59d]/10 px-5 py-2 rounded transition-all focus:outline-none focus:ring-1 focus:ring-[#2ee59d] uppercase tracking-widest font-semibold">
                <!-- Icono Reload -->
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                REINICIAR SESIÓN
            </button>
            
            <!-- Botón Verificar Conexión -->
            <button onclick="window.location.href='/index.html'" class="flex items-center gap-2.5 text-[#8b9b96] hover:text-white transition-colors focus:outline-none focus:ring-1 focus:ring-[#8b9b96] rounded px-3 py-2 tracking-wide">
                <!-- Icono Flechas <-> -->
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                </svg>
                Verificar Conexión
            </button>

        </div>

    </div>

</body>
</html>
