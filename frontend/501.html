<!DOCTYPE html>

    <link rel="stylesheet" href="/static/css/styles.css">
    
    <!-- Script temporal de Tailwind en caso de que no se haya compilado -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { 
                mono: ['"JetBrains Mono"', 'monospace'],
                sans: ['Inter', 'sans-serif']
            }
          }
        }
      }

    <style>
        /* Patrón de puntos tenues del fondo de la tarjeta */
        .dot-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: center top;
        }
        /* Resplandor superior tipo "glassmorphism / neón" */
        .glow-top-border {
            box-shadow: inset 0 1px 15px rgba(46, 229, 157, 0.1), 0 -2px 10px rgba(46, 229, 157, 0.3);
            border-top: 2px solid #2ee59d;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .animate-shimmer {
            animation: shimmer 2s infinite linear;
        }
    </style>
</head>
<body class="bg-[#0b1011] text-gray-300 font-sans min-h-screen flex items-center justify-center p-4">

        <!-- Logo animado central -->

            <div class="absolute inset-4 border border-[#2d3a37] rounded-lg transform -rotate-6 opacity-40 transition-transform duration-700 group-hover:-rotate-12"></div>

        <div class="border border-[#213a30] bg-[#0c1613] text-[#2ee59d] rounded-full px-4 py-1.5 flex items-center gap-2 mb-6 shadow-inner font-mono text-[9px] sm:text-[10px] tracking-widest font-bold">

            UNDER CULTIVATION

        <h1 class="text-xl sm:text-2xl font-bold text-[#f3f4f6] mb-6 tracking-widest font-sans uppercase">Cultivando Funcionalidad</h1>
        
        <p class="text-[#8b9b96] text-sm sm:text-[15px] max-w-lg mb-10 leading-relaxed px-2">
            Esta sección está en fase de germinación y aún no es apta para el consumo operativo. Nuestros técnicos están calibrando los sensores de interfaz.
        </p>

        <!-- Progress Box -->
        <div class="bg-[#121a19] border border-[#212a28] rounded w-full max-w-[500px] p-6 mb-12 text-left font-mono relative overflow-hidden">
            <!-- Brillo de fondo para la barra -->
            <div class="absolute top-1/2 left-1/4 w-32 h-10 bg-[#2ee59d] opacity-[0.03] blur-xl rounded-full"></div>

            <div class="flex justify-between items-end mb-3 relative z-10">
                <span class="text-[#2ee59d] text-[11px] font-bold tracking-widest">GROWTH PHASE</span>
                <span class="text-white text-2xl sm:text-3xl font-light">45%</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full h-2 bg-[#1b2624] rounded-full overflow-hidden mb-4 relative z-10">
                <div class="h-full bg-[#2ee59d] w-[45%] rounded-full shadow-[0_0_10px_#2ee59d] relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/50 to-transparent w-full h-full animate-shimmer"></div>

            </div>
            <div class="flex justify-between text-[9px] sm:text-[10px] text-[#5b6b66] tracking-widest uppercase relative z-10">

                <span>Deployment</span>

        <div class="w-full flex justify-center items-center mb-4">

            <button onclick="window.location.href='/index.html'" class="flex items-center gap-3 border border-[#2ee59d] text-[#2ee59d] hover:bg-[#2ee59d]/10 px-6 py-3 rounded-sm transition-all focus:outline-none focus:ring-1 focus:ring-[#2ee59d] tracking-[0.15em] text-[11px] sm:text-xs font-mono font-bold uppercase shadow-[0_0_15px_rgba(46,229,157,0.1)] hover:shadow-[0_0_20px_rgba(46,229,157,0.2)]">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>

            <span>SYS_ERR: 501_NOT_IMPL</span>
            <span>LNK_STAT: OFFLINE</span>
