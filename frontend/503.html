<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLE-IA | 503 - Mantenimiento Programado</title>
    <!-- Incluir fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    
    <!-- Script temporal de Tailwind en caso de que no se haya compilado -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { 
                mono: ['"JetBrains Mono"', 'monospace'],
                sans: ['Inter', 'sans-serif']
            }
          }
        }
      }
    </script>
</head>
<body class="bg-[#0b1011] text-gray-300 font-sans min-h-screen flex items-center justify-center p-4 overflow-x-hidden">

    <!-- Tarjeta principal envolvente -->
    <div class="bg-[#121615] border border-[#232e2a] rounded-xl max-w-[850px] w-full flex flex-col md:flex-row items-stretch shadow-[0_20px_50px_rgba(0,0,0,0.6)] overflow-hidden min-h-[300px]">
        
        <!-- Columna Izquierda (Gráfico) -->
        <div class="w-full md:w-[40%] bg-[#171e1d] relative flex items-center justify-center min-h-[250px] border-b md:border-b-0 md:border-r border-[#232e2a] overflow-hidden p-8">
            <!-- Imagen de la flor de fondo -->
            <img src="/static/images/dark_flower.png" alt="Dark Flower" class="absolute inset-0 w-full h-full object-cover opacity-10 grayscale">
            
            <!-- Resplandor sutil trasero -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="w-32 h-32 bg-[#34e29c] opacity-[0.05] blur-3xl rounded-full"></div>
            </div>

            <!-- Imagen del mole -->
            <div class="relative z-10 shadow-[0_0_30px_rgba(0,0,0,0.8)] rounded-xl overflow-hidden border-2 border-gray-300 w-44 h-44 bg-black flex items-center justify-center">
                 <img src="/static/images/error_503.png" alt="Error 503 Mole" class="w-full h-full object-cover" onerror="this.src='/static/images/error_400.png'">
            </div>
        </div>

        <!-- Columna Derecha (Contenido de Error) -->
        <div class="w-full md:w-[60%] p-8 sm:p-10 relative flex flex-col justify-center">
            
            <!-- Marca de agua 503 de fondo -->
            <div class="absolute top-1/2 -translate-y-1/2 right-8 text-[#1a2622] font-black text-8xl sm:text-9xl leading-none select-none z-0 tracking-tighter pointer-events-none font-mono">503</div>
            
            <!-- Contenido frontal -->
            <div class="relative z-10 flex-grow flex flex-col h-full justify-between">
                <div>
                    <!-- Header: SYSTEM ALERT -->
                    <div class="flex items-center gap-2 text-[#e2a875] mb-3">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <span class="text-[11px] font-mono font-bold tracking-[0.1em] uppercase">SYSTEM ALERT</span>
                    </div>

                    <!-- Título y Texto -->
                    <h1 class="text-3xl sm:text-4xl font-bold text-[#34e29c] mb-1 tracking-wide font-sans">ERROR 503</h1>
                    <p class="text-[#8c9f9a] text-xs sm:text-sm uppercase tracking-wider mb-8 font-medium">
                        SISTEMA EN CALIBRACIÓN
                    </p>
                </div>

                <!-- Botones -->
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-start gap-6 font-mono text-[10px] sm:text-[11px] uppercase tracking-widest font-bold mt-12">
                    <button onclick="window.location.reload()" class="w-full sm:w-auto flex items-center justify-center gap-2 border border-[#34e29c] text-[#34e29c] hover:bg-[#34e29c]/10 px-5 py-2.5 rounded-sm transition-all focus:outline-none focus:ring-1 focus:ring-[#34e29c]">
                        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        REINTENTAR CONEXIÓN
                    </button>
                    <button onclick="window.location.href='/index.html'" class="w-full sm:w-auto flex items-center justify-center gap-2 text-[#8c9f9a] hover:text-white transition-colors focus:outline-none">
                        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12h4l3-9 5 18 3-9h4"></path></svg>
                        VOLVER AL MONITOR
                    </button>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
