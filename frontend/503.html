<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLE-IA | Mantenimiento Programado</title>
    <!-- Incluir fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    
    <!-- Script temporal de Tailwind en caso de que no se haya compilado -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { 
                mono: ['"JetBrains Mono"', 'monospace'],
                sans: ['Inter', 'sans-serif']
            }
          }
        }
      }
    </script>
</head>
<body class="bg-[#0b1011] text-gray-300 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Tarjeta principal -->
    <div class="bg-[#131b1a] border border-[#2a3f3a] rounded-xl p-8 sm:p-12 max-w-2xl w-full shadow-[0_0_30px_rgba(0,0,0,0.5)] flex flex-col items-center text-center">
        
        <!-- Imagen central -->
        <div class="mb-8 rounded-xl overflow-hidden border border-[#2a4f44] shadow-[0_0_20px_rgba(0,255,204,0.15)] bg-[#05080a] w-64 h-64 sm:w-80 sm:h-80 mx-auto relative group">
            <div class="absolute inset-0 bg-[#00e6a4] opacity-0 group-hover:opacity-10 transition-opacity duration-500 z-10 pointer-events-none"></div>
            <img src="/static/images/mantenimiento.png" alt="Planta Fitosanitaria en Análisis" class="w-full h-full object-cover">
        </div>

        <!-- Títulos -->
        <h1 class="text-3xl sm:text-4xl font-bold text-[#2ee59d] mb-4 tracking-wide font-sans">Mantenimiento Programado</h1>
        <p class="text-[#a1b0ab] text-sm sm:text-base max-w-md mb-8 leading-relaxed">
            Estamos optimizando los algoritmos de IA y la base de datos fitosanitaria. Volveremos a estar en línea pronto.
        </p>

        <!-- Info Box (con fuente monospace) -->
        <div class="bg-[#212a28]/80 border border-[#2d3a37] rounded w-full max-w-lg p-5 mb-8 text-left text-sm font-mono shadow-inner">
            <div class="flex justify-between items-center">
                <span class="text-[#8b9b96] tracking-wider text-xs">ESTADO DEL SISTEMA</span>
                <div class="flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#f97316] animate-pulse shadow-[0_0_5px_#f97316]"></span>
                    <span class="text-[#f97316] uppercase text-xs tracking-wider">CALIBRANDO</span>
                </div>
            </div>
        </div>

        <!-- Botones -->
        <div class="w-full max-w-lg flex justify-end items-center mt-2 font-mono">
            <!-- Botón regresar (Twitter eliminado) -->
            <button onclick="window.location.href='/index.html'" class="text-[#8b9b96] hover:text-white text-xs sm:text-sm transition-colors tracking-wide focus:outline-none focus:ring-1 focus:ring-[#2ee59d] rounded px-4 py-2 hover:bg-[#ffffff05]">
                Regresar más tarde
            </button>
        </div>

    </div>

</body>
</html>
