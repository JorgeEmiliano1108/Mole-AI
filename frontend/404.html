<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLE-IA | 404 - No Encontrado</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-mole-base text-mole-cyan font-mono min-h-screen relative overflow-x-hidden">

    <div class="min-h-screen flex items-center justify-center p-4 sm:p-8">
        <div class="w-full max-w-2xl">

            <div class="bg-mole-surface border border-mole-border rounded-lg p-6 sm:p-12 flex flex-col justify-center shadow-cyber relative overflow-hidden text-center">
                <!-- Decorative corner brackets -->
                <div class="absolute top-0 left-0 w-6 h-6 border-t-2 border-l-2 border-mole-cyan/30"></div>
                <div class="absolute top-0 right-0 w-6 h-6 border-t-2 border-r-2 border-mole-cyan/30"></div>
                <div class="absolute bottom-0 left-0 w-6 h-6 border-b-2 border-l-2 border-mole-cyan/30"></div>
                <div class="absolute bottom-0 right-0 w-6 h-6 border-b-2 border-r-2 border-mole-cyan/30"></div>

                <div class="flex flex-col items-center justify-center">
                    <div class="mb-6 relative">
                        <h1 class="text-7xl sm:text-9xl font-bold tracking-tight text-mole-cyan relative z-10" style="text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);">404</h1>
                        <div class="absolute inset-0 text-7xl sm:text-9xl font-bold tracking-tight text-mole-cyan/30 translate-x-1 translate-y-1 z-0">404</div>
                    </div>
                    
                    <h2 class="text-xl sm:text-2xl tracking-[0.1em] uppercase text-mole-cyan mb-2">SECTOR DESCONOCIDO</h2>
                    <p class="text-sm text-mole-dim/80 mb-8 max-w-md mx-auto">La coordenada de red que buscas no existe o fue movida. El sistema no puede localizar este recurso en la base de datos.</p>

                    <div class="w-full h-px bg-gradient-to-r from-transparent via-mole-border to-transparent mb-8"></div>

                    <div class="flex flex-col sm:flex-row gap-4 justify-center w-full max-w-md mx-auto">
                        <button onclick="window.history.back()" class="flex-1 px-4 py-3 rounded border border-mole-border bg-mole-base/50 hover:border-mole-cyan/50 hover:bg-mole-cyan/5 transition-all text-sm font-medium text-mole-dim hover:text-mole-cyan focus:outline-none focus:ring-2 focus:ring-mole-cyan uppercase">
                            [ Volver Atrás ]
                        </button>
                        <a href="/index.html" class="flex-1 border-2 border-mole-cyan text-mole-cyan py-3 rounded font-bold tracking-widest text-sm hover:bg-mole-cyan hover:text-mole-base transition-all shadow-cyber hover:shadow-cyber-hover uppercase flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-mole-cyan">
                            Ir al Inicio
                        </a>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Legal Disclaimer -->
    <div class="fixed bottom-0 w-full bg-mole-surface/90 backdrop-blur-sm border-t border-mole-border p-2.5 text-center z-30">
        <p class="text-[10px] text-mole-dim/70 font-mono">
            <span class="text-mole-cyan/70 font-bold">[SISTEMA]</span> Error de enrutamiento detectado y registrado.
        </p>
    </div>

</body>
</html>
