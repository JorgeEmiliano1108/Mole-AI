<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLE-IA | Autenticación</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* HTML5 Validation — Retro-styled feedback */
        #login-form input:focus { border-color: rgba(0, 229, 255, 0.5); box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.1); }
        #login-form input:valid:not(:placeholder-shown) { border-color: rgba(52, 211, 153, 0.5); }
        #login-form input:invalid:not(:placeholder-shown):not(:focus) { border-color: rgba(248, 113, 113, 0.5); }
    </style>
</head>
<body class="bg-mole-base text-mole-cyan font-mono min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">



    <div id="toast-container" aria-live="polite" class="fixed top-4 right-4 z-50"></div>

    <div class="w-full max-w-md bg-mole-surface border border-mole-border rounded-lg p-8 sm:p-10 relative overflow-hidden shadow-cyber">
        <!-- Top accent line -->
        <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-mole-cyan/60 to-transparent"></div>

        <!-- Corner brackets -->
        <div class="absolute top-0 left-0 w-5 h-5 border-t-2 border-l-2 border-mole-cyan/30"></div>
        <div class="absolute top-0 right-0 w-5 h-5 border-t-2 border-r-2 border-mole-cyan/30"></div>
        <div class="absolute bottom-0 left-0 w-5 h-5 border-b-2 border-l-2 border-mole-cyan/30"></div>
        <div class="absolute bottom-0 right-0 w-5 h-5 border-b-2 border-r-2 border-mole-cyan/30"></div>

        <a href="/index.html" class="inline-flex items-center text-xs text-mole-dim hover:text-mole-cyan transition-colors mb-6 font-mono focus:outline-none focus:ring-2 focus:ring-mole-cyan rounded">
            <span class="mr-1">&lt;-</span> Volver al inicio
        </a>

        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-mole-cyan tracking-tight mb-1">AUTENTICACIÓN</h2>
            <p class="text-xs text-mole-dim tracking-widest uppercase">Ingrese credenciales de operador</p>
        </div>

        <form id="login-form" class="space-y-5" onsubmit="event.preventDefault(); document.querySelector('[data-action=\'auth:login\']').click();">
            <div>
                <label for="user-input" class="block text-xs font-bold text-mole-dim uppercase tracking-wider mb-2">Correo / Usuario</label>
                <input type="text" id="user-input" required
                       class="w-full px-4 py-3 rounded border border-mole-border bg-mole-base text-mole-cyan placeholder-mole-dim/40 outline-none transition-all font-mono text-sm focus:ring-2 focus:ring-mole-cyan"
                       placeholder="operador@granja.mx">
            </div>

            <div>
                <label for="pass-input" class="block text-xs font-bold text-mole-dim uppercase tracking-wider mb-2">Contraseña</label>
                <input type="password" id="pass-input" required minlength="6"
                       class="w-full px-4 py-3 rounded border border-mole-border bg-mole-base text-mole-cyan placeholder-mole-dim/40 outline-none transition-all font-mono text-sm focus:ring-2 focus:ring-mole-cyan"
                       placeholder="••••••••">
            </div>

            <p id="login-error" class="text-mole-red text-xs font-bold hidden text-center mt-2 font-mono tracking-wider">[ERROR] Credenciales incorrectas.</p>

            <button type="button" data-action="auth:login" class="w-full border-2 border-mole-cyan text-mole-cyan py-3 rounded font-bold tracking-widest text-sm hover:bg-mole-cyan hover:text-mole-base transition-all shadow-cyber hover:shadow-cyber-hover uppercase mt-4 focus:outline-none focus:ring-2 focus:ring-mole-cyan focus:ring-offset-2 focus:ring-offset-mole-base">
                Iniciar Sesión
            </button>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mt-6 pt-6 border-t border-mole-border text-xs">
                <button type="button" data-action="auth:forgot" class="text-mole-dim hover:text-mole-cyan font-mono transition-colors focus:outline-none focus:ring-2 focus:ring-mole-cyan rounded">¿Olvidó contraseña?</button>
                <button type="button" data-action="nav:register" class="text-mole-dim hover:text-mole-cyan font-mono transition-colors focus:outline-none focus:ring-2 focus:ring-mole-cyan rounded">Solicitar acceso</button>
            </div>
        </form>
    </div>

    <!-- Legal -->
    <div class="mt-6 max-w-md text-center">
        <p class="text-[10px] text-mole-dim/50 font-mono leading-relaxed">
            <span class="text-mole-amber/60 font-bold">[LEGAL]</span> Diagnósticos informativos y probabilísticos. No sustituyen criterio agrónomo certificado. NOM-059-SEMARNAT.
        </p>
    </div>

    <script type="module" src="/src/js/main.js"></script>
</body>
</html>
