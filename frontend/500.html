<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLE-IA | 500 - Error de Servidor</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-mole-base text-mole-cyan font-mono min-h-screen relative overflow-x-hidden">

    <div class="min-h-screen flex items-center justify-center p-4 sm:p-8">
        <div class="w-full max-w-2xl">

            <div class="bg-mole-surface border border-[#FBBF24]/50 rounded-lg p-6 sm:p-12 flex flex-col justify-center shadow-[0_0_15px_rgba(251,191,36,0.2)] relative overflow-hidden text-center">
                <!-- Decorative corner brackets - Amber -->
                <div class="absolute top-0 left-0 w-6 h-6 border-t-2 border-l-2 border-[#FBBF24]/50"></div>
                <div class="absolute top-0 right-0 w-6 h-6 border-t-2 border-r-2 border-[#FBBF24]/50"></div>
                <div class="absolute bottom-0 left-0 w-6 h-6 border-b-2 border-l-2 border-[#FBBF24]/50"></div>
                <div class="absolute bottom-0 right-0 w-6 h-6 border-b-2 border-r-2 border-[#FBBF24]/50"></div>

                <div class="flex flex-col items-center justify-center">
                    <div class="mb-6 relative">
                        <h1 id="error-code" class="text-7xl sm:text-9xl font-bold tracking-tight text-[#FBBF24] relative z-10" style="text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);">500</h1>
                        <div id="error-code-bg" class="absolute inset-0 text-7xl sm:text-9xl font-bold tracking-tight text-[#FBBF24]/30 translate-x-1 translate-y-1 z-0 animate-pulse">500</div>
                    </div>
                    
                    <h2 class="text-xl sm:text-2xl tracking-[0.1em] uppercase text-[#FBBF24] mb-2">SISTEMA COMPROMETIDO</h2>
                    <p class="text-sm text-mole-dim/80 mb-8 max-w-md mx-auto">La terminal ha perdido conexión con el núcleo. Ocurrió un error interno o el servicio está temporalmente en mantenimiento.</p>

                    <div class="w-full h-px bg-gradient-to-r from-transparent via-[#FBBF24]/30 to-transparent mb-8"></div>

                    <div class="flex flex-col sm:flex-row gap-4 justify-center w-full max-w-md mx-auto">
                        <button onclick="window.location.reload()" class="flex-1 px-4 py-3 rounded border border-mole-border bg-mole-base/50 hover:border-[#FBBF24]/50 hover:bg-[#FBBF24]/10 transition-all text-sm font-medium text-mole-dim hover:text-[#FBBF24] focus:outline-none focus:ring-2 focus:ring-[#FBBF24] uppercase">
                            [ Reintentar Conexión ]
                        </button>
                        <a href="/index.html" class="flex-1 border-2 border-[#FBBF24] text-[#FBBF24] py-3 rounded font-bold tracking-widest text-sm hover:bg-[#FBBF24] hover:text-mole-base transition-all shadow-[0_0_10px_rgba(251,191,36,0.3)] hover:shadow-[0_0_20px_rgba(251,191,36,0.6)] uppercase flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-[#FBBF24]">
                            Ir al Inicio
                        </a>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Legal Disclaimer -->
    <div class="fixed bottom-0 w-full bg-mole-surface/90 backdrop-blur-sm border-t border-[#FBBF24]/30 p-2.5 text-center z-30">
        <p class="text-[10px] text-[#FBBF24]/70 font-mono">
            <span class="text-[#FBBF24] font-bold">[MANTENIMIENTO]</span> Los droides de ingeniería ya han sido notificados de esta anomalía.
        </p>
    </div>

    <script>
        // Actualiza el código si fue pasado por URL, para cubrir tanto 500 como 503
        const params = new URLSearchParams(window.location.search);
        const status = params.get('status');
        if (status && (status === '500' || status === '502' || status === '503' || status === '504')) {
            document.getElementById('error-code').innerText = status;
            document.getElementById('error-code-bg').innerText = status;
        }
    </script>
</body>
</html>
