<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLE-IA | Sin Conexión</title>
    <style>
        /* ── Mole.AI Design System — Inline (Zero Dependencies) ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0B0F19;
            --surface: #111827;
            --border: #1E293B;
            --cyan: #00E5FF;
            --dim: #94A3B8;
        }

        body {
            background-color: var(--bg);
            color: var(--cyan);
            font-family: 'Courier New', 'Consolas', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
            position: relative;
        }

        .card {
            background: var(--surface);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            padding: 3rem 2rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
        }

        /* Corner brackets */
        .card::before, .card::after { content: ''; position: absolute; width: 24px; height: 24px; }
        .card::before { top: 0; left: 0; border-top: 2px solid rgba(0,229,255,0.3); border-left: 2px solid rgba(0,229,255,0.3); }
        .card::after { top: 0; right: 0; border-top: 2px solid rgba(0,229,255,0.3); border-right: 2px solid rgba(0,229,255,0.3); }
        .corner-bl, .corner-br { position: absolute; width: 24px; height: 24px; }
        .corner-bl { bottom: 0; left: 0; border-bottom: 2px solid rgba(0,229,255,0.3); border-left: 2px solid rgba(0,229,255,0.3); }
        .corner-br { bottom: 0; right: 0; border-bottom: 2px solid rgba(0,229,255,0.3); border-right: 2px solid rgba(0,229,255,0.3); }

        .error-code {
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 700;
            letter-spacing: -2px;
            color: var(--cyan);
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            line-height: 1;
            margin-bottom: 1rem;
            position: relative;
        }

        .error-code-shadow {
            position: absolute;
            inset: 0;
            font-size: clamp(4rem, 15vw, 8rem);
            font-weight: 700;
            letter-spacing: -2px;
            color: rgba(0, 229, 255, 0.2);
            transform: translate(4px, 4px);
            line-height: 1;
            z-index: 0;
        }

        h2 {
            font-size: 1.25rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--cyan);
            margin-bottom: 0.5rem;
        }

        .description {
            font-size: 0.875rem;
            color: var(--dim);
            opacity: 0.8;
            margin-bottom: 2rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(0,229,255,0.3), transparent);
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        @media (min-width: 640px) {
            .buttons { flex-direction: row; }
        }

        .btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
        }

        .btn-secondary {
            background: rgba(11, 15, 25, 0.5);
            border: 1px solid var(--border);
            color: var(--dim);
        }
        .btn-secondary:hover {
            border-color: rgba(0, 229, 255, 0.5);
            background: rgba(0, 229, 255, 0.05);
            color: var(--cyan);
        }

        .btn-primary {
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }
        .btn-primary:hover {
            background: var(--cyan);
            color: var(--bg);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        }

        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(0, 229, 255, 0.2);
            padding: 0.625rem;
            text-align: center;
            z-index: 30;
        }
        .footer p {
            font-size: 10px;
            color: rgba(0, 229, 255, 0.5);
        }
        .footer .tag { color: var(--cyan); font-weight: 700; }

        /* Pulse animation (no @import needed) */
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .pulse { animation: pulse 2s ease-in-out infinite; }

        /* Online banner */
        .online-banner {
            display: none;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.4);
            color: #34D399;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 1.5rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .online-banner.visible { display: block; }

        /* Wifi icon SVG inline */
        .wifi-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="corner-bl"></div>
        <div class="corner-br"></div>

        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <!-- Wifi-off icon (inline SVG, no external dependency) -->
            <svg class="wifi-icon pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>

            <div style="margin-bottom:1.5rem;position:relative;">
                <div class="error-code" style="position:relative;z-index:1;">OFFLINE</div>
                <div class="error-code-shadow pulse">OFFLINE</div>
            </div>
            
            <h2>SIN CONEXIÓN A LA RED</h2>
            <p class="description">Tu dispositivo ha perdido la conexión a internet. Verifica tu Wi-Fi o datos móviles y reintenta.</p>

            <div class="divider"></div>

            <div class="buttons">
                <button onclick="window.location.reload()" class="btn btn-secondary">
                    [ Reintentar ]
                </button>
                <a href="/index.html" class="btn btn-primary">
                    Ir al Inicio
                </a>
            </div>

            <!-- Banner de reconexión (aparece automáticamente) -->
            <div id="online-banner" class="online-banner">
                ✓ Conexión restablecida — <a href="#" onclick="window.location.reload(); return false;" style="color:#34D399;font-weight:700;text-decoration:underline;">Recargar página</a>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div class="footer">
        <p>
            <span class="tag">[RED]</span> El sistema está operativo. Este dispositivo no tiene conexión activa.
        </p>
    </div>

    <script>
        // Detectar reconexión automáticamente
        window.addEventListener('online', function() {
            var banner = document.getElementById('online-banner');
            if (banner) banner.classList.add('visible');
        });

        // Si ya tiene internet al cargar, redirigir directamente
        if (navigator.onLine) {
            window.location.replace('/index.html');
        }
    </script>
</body>
</html>
