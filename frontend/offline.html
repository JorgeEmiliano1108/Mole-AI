<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLE-IA | Enlace Perdido (Offline)</title>
    <!-- Incluir fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    
    <!-- Script temporal de Tailwind en caso de que no se haya compilado -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { 
                mono: ['"JetBrains Mono"', 'monospace'],
                sans: ['Inter', 'sans-serif']
            }
          }
        }
      }
    </script>
</head>
<body class="bg-[#0b1011] text-gray-300 font-sans min-h-screen relative flex flex-col justify-center overflow-x-hidden">

    <!-- Fondo Gradient Sutil Radial -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#101a18] via-[#0b1011] to-[#0b1011] pointer-events-none z-0"></div>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-8 z-10 w-full relative">
        <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-16 items-center">
            
            <!-- Columna Izquierda (Gráfico del Enlace Roto) -->
            <div class="flex justify-center md:justify-end w-full">
                <div class="bg-[#0e1413] border border-[#1b2523] rounded-3xl p-8 shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative flex items-center justify-center h-[320px] w-[320px] sm:h-[400px] sm:w-[400px]">
                    <!-- Círculos concéntricos punteados de radar -->
                    <div class="absolute inset-4 border border-dashed border-[#1b2523] rounded-full opacity-50"></div>
                    <div class="absolute inset-16 border border-dashed border-[#1b2523] rounded-full opacity-50"></div>
                    <div class="absolute inset-28 border border-[#1b2523] rounded-full opacity-30"></div>
                    
                    <!-- Ejes del radar -->
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
                        <div class="w-full h-px bg-gradient-to-r from-transparent via-[#2d3a37] to-transparent"></div>
                    </div>
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
                        <div class="h-full w-px bg-gradient-to-t from-transparent via-[#2d3a37] to-transparent"></div>
                    </div>

                    <!-- Gráficos Centrales SVG (Enlace roto y planta) -->
                    <div class="relative z-10 w-48 h-48 flex items-center justify-center">
                        <svg class="w-full h-full" viewBox="0 0 100 100" fill="none">
                            <!-- Icono de Enlace Roto (Rojo Coral) -->
                            <g stroke="#ff8a75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                                <!-- Eslabón izquierdo -->
                                <path d="M35 55 A 15 15 0 0 1 35 35 L 45 35"></path>
                                <path d="M35 55 L 45 55"></path>
                                <!-- Eslabón derecho -->
                                <path d="M65 45 A 15 15 0 0 1 65 65 L 55 65"></path>
                                <path d="M65 45 L 55 45"></path>
                                <!-- Línea de ruptura -->
                                <line x1="30" y1="30" x2="70" y2="70" stroke-width="5"></line>
                            </g>

                            <!-- Plantitas Verdes Flotantes -->
                            <g stroke="#2ee59d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
                                <!-- Hoja suelta inferior izq -->
                                <path d="M20 70 C 20 60, 30 60, 30 70 C 30 80, 20 80, 20 70 Z"></path>
                                <path d="M20 70 L 25 75"></path>
                                
                                <!-- Maceta/Planta superior derecha -->
                                <g transform="translate(65, 15) rotate(15)">
                                    <path d="M10 20 L 5 10 L 25 10 L 20 20 Z"></path>
                                    <line x1="15" y1="10" x2="15" y2="0"></line>
                                    <path d="M15 5 C 10 5, 10 0, 15 0"></path>
                                    <path d="M15 5 C 20 5, 20 0, 15 0"></path>
                                </g>
                            </g>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha (Texto, Diagnóstico y Botones) -->
            <div class="flex flex-col gap-6 w-full max-w-[450px]">
                
                <!-- Etiqueta de Error -->
                <div class="self-start bg-[#1a1111]/80 border border-[#3b201f] rounded-sm px-3 py-1.5 mb-2">
                    <span class="text-[#ff8a75] font-mono text-[10px] font-bold tracking-widest uppercase">
                        CRITICAL_CONNECTION_FAILURE
                    </span>
                </div>
                
                <!-- Título y Descripción -->
                <div>
                    <h1 class="text-3xl sm:text-4xl font-bold text-[#f3f4f6] mb-4 tracking-wide font-sans">Enlace Perdido</h1>
                    <p class="text-[#8b9b96] text-sm sm:text-[15px] leading-relaxed">
                        El sistema ha perdido la conexión con el servidor central. Los sensores locales están en modo de espera, preservando la integridad de los datos.
                    </p>
                </div>

                <!-- Caja de Diagnóstico -->
                <div class="border border-[#1b2523] rounded-lg p-5 sm:p-6 bg-[#0a0f0e] shadow-inner font-mono w-full">
                    <div class="flex justify-between items-center mb-5 pb-4 border-b border-[#1b2523]">
                        <span class="text-[#8b9b96] text-[10px] tracking-widest font-bold uppercase">PANEL DE DIAGNÓSTICO</span>
                        <div class="flex gap-1">
                            <div class="w-1.5 h-1.5 rounded-full bg-[#ff8a75]"></div>
                            <div class="w-1.5 h-1.5 rounded-full bg-[#2d3a37]"></div>
                            <div class="w-1.5 h-1.5 rounded-full bg-[#2d3a37]"></div>
                        </div>
                    </div>
                    
                    <div class="flex flex-col gap-3 text-[10px] sm:text-xs tracking-wider">
                        <div class="flex justify-between">
                            <span class="text-[#8b9b96]">ERROR_CODE:</span>
                            <span class="text-[#ff8a75] font-bold">SIGNAL_LOSS</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-[#8b9b96]">RECONNECT_ATTEMPT:</span>
                            <span class="text-[#2ee59d]">03</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-[#8b9b96]">PING_RESPONSE:</span>
                            <span class="text-[#a1b0ab]">TIMEOUT</span>
                        </div>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="flex flex-col gap-4 mt-2">
                    <!-- Botón Reintentar (Border) -->
                    <button onclick="window.location.reload()" class="w-full flex items-center justify-center gap-3 border border-[#2ee59d] text-[#2ee59d] hover:bg-[#2ee59d]/10 px-4 py-3.5 rounded transition-all focus:outline-none focus:ring-1 focus:ring-[#2ee59d] font-mono text-[11px] font-bold tracking-widest uppercase shadow-[0_0_15px_rgba(46,229,157,0.05)]">
                        Reintentar Conexión
                    </button>
                    
                    <!-- Botón Trabajar Offline (Text Only) -->
                    <button class="w-full flex items-center justify-center gap-3 text-[#a1b0ab] hover:text-white px-4 py-3 transition-colors focus:outline-none font-mono text-[10px] font-bold tracking-widest">
                        <!-- Icono base de datos / servidor local -->
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                        Trabajar Offline (Modo Local)
                    </button>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer Inferior -->
    <footer class="w-full px-8 py-6 flex justify-between items-end fixed bottom-0 left-0 z-20 font-mono pointer-events-none">
        <!-- Logo y Versión -->
        <div class="flex items-center gap-3 opacity-90">
            <span class="text-[#2ee59d] font-black text-xl tracking-tighter">MOLE-AI</span>
        </div>
        
        <!-- Botón Ayuda Circular -->
        <button class="pointer-events-auto w-8 h-8 rounded-full border border-[#5b6b66] text-[#5b6b66] flex items-center justify-center hover:text-[#2ee59d] hover:border-[#2ee59d] transition-colors focus:outline-none">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>
    </footer>

</body>
</html>
