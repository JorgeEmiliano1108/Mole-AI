worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      '"$http_x_forwarded_for" '
                      '"Auth: $http_authorization"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Upload limit (plant images, sensor batches) ──────────────────────
    client_max_body_size 20M;

    # ── Security Headers (applied globally) ──────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "DENY"                           always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection        "1; mode=block"                  always;

    # ── Upstream Definitions ─────────────────────────────────────────────
    # Django is critical — keep as static upstream (guaranteed by healthcheck)
    upstream django_backend {
        server django-backend:8000;
    }

    # Microservices use lazy DNS resolution via variables + resolver
    # so Nginx boots even if a microservice is temporarily down.

    # ── CORS map: derive allowed origin from request ─────────────────────
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
        "~^https://mole-ia\.com$"         $http_origin;
        "~^https://www\.mole-ia\.com$"    $http_origin;
        "~^https://mole-ia\.duckdns\.org$" $http_origin;
    }

    # ====================================================================
    # HTTP Server — Active (Release Candidate / Local Dev)
    # ====================================================================
    server {
        listen 80;
        server_name _;

        # Docker internal DNS — enables lazy resolution for microservice variables
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;

        # ── Root global (heredado por todos los location blocks) ──────────
        root /usr/share/nginx/html;

        set $cors_methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        set $cors_headers "Accept, Authorization, Content-Type, X-CSRFToken, X-Requested-With, X-Hardware-Api-Key";

        # ── 1. FRONTEND MPA (Vite Dist) ──────────────────────────────────
        # Nginx sirve directamente los archivos estáticos desde el disco.
        location / {
            index index.html;
            # Strip trailing slash para Clean URLs MPA:
            #   /login/  → 301 → /login  → try_files → login.html ✅
            #   Regex NO matchea "/" (raíz) — solo paths con contenido.
            #   Excluye explícitamente /api/ y /admin/ (evita 405 en POST).
            rewrite ^/(?!(api|admin)/)(.+)/$ /$2 permanent;
            try_files $uri $uri.html $uri/ =404;
        }

        # ── 1.1 Anti-Cache para HTML (siempre revalidar) ─────────────
        location ~* \.html$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # ── 1.2 Long-term Cache para Assets con Hash (immutable) ────
        # ── Static assets from Vite (CSS/JS) ───────────────────────────────────────
        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
        }

        # ── 1.5. STATIC ASSETS (legacy / apiService) ──────────────────────
        location /static/ {
            alias /usr/share/nginx/static/;
            # Cache control can be adjusted as needed
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            access_log off;
        }

        # ── 2. BACKEND API (Django Catch-all para API) ───────────────────
        # Envia las peticiones /api/ core a Django
        location /api/v1/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  $cors_origin always;
                add_header 'Access-Control-Allow-Methods' $cors_methods always;
                add_header 'Access-Control-Allow-Headers' $cors_headers always;
                add_header 'Access-Control-Max-Age'       86400;
                add_header 'Content-Length'                0;
                return 204;
            }

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization  $http_authorization;

            proxy_pass http://django_backend;

            include /etc/nginx/conf.d/cors_headers.conf;
        }
        
        # ── 3. MICROSERVICES (Ruteo Directo) ────────────────────────────
        # MS1 Vision: /api/v1/vision/*
        location /api/v1/vision/ {
            if ($request_method = 'OPTIONS') { add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always; add_header 'Access-Control-Max-Age' 86400; add_header 'Content-Length' 0; return 204; }
            # Lazy DNS: resolved at request time, not startup
            set $upstream_vision http://ms1_vision:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_redirect off;
            include /etc/nginx/conf.d/cors_headers.conf;
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            proxy_pass $upstream_vision;
        }

        # MS2 Chat/RAG: /api/v1/mole-ai/*
        location /api/v1/mole-ai/ {
            if ($request_method = 'OPTIONS') { add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always; add_header 'Access-Control-Max-Age' 86400; add_header 'Content-Length' 0; return 204; }
            set $upstream_chat http://ms2_chat:8002;
            proxy_pass $upstream_chat;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always;
        }

        # MS2 Knowledge: /api/v1/knowledge/*
        location /api/v1/knowledge/ {
            if ($request_method = 'OPTIONS') { add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always; add_header 'Access-Control-Max-Age' 86400; add_header 'Content-Length' 0; return 204; }
            set $upstream_knowledge http://ms2_chat:8002;
            proxy_pass $upstream_knowledge;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization;
            add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always;
        }

        # MS3 Reports: /api/v1/reports/*
        location /api/v1/reports/ {
            if ($request_method = 'OPTIONS') { add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always; add_header 'Access-Control-Max-Age' 86400; add_header 'Content-Length' 0; return 204; }
            set $upstream_reports http://ms3_reports:8003;
            proxy_pass $upstream_reports;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization;
            add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always;
        }

        # ── 4. DJANGO ADMIN (Backoffice) ─────────────────────────────────
        # Mantenemos acceso al admin de Django
        location /admin/ {
            proxy_pass http://django_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization      $http_authorization;
        }
        
        # Estáticos del Admin de Django
        location /static/admin/ {
             proxy_pass http://django_backend;
        }

        # ── 5. WEBSOCKETS (Django Channels) ──────────────────────────────
        location /ws/ {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }

    # ====================================================================
    # HTTPS Server — Prepared for Production (Certbot / Let's Encrypt)
    # ====================================================================
    # Uncomment this block and provide certificate paths when deploying
    # to a production environment with a valid domain.
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.mole.ai;
    #
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.mole.ai/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.mole.ai/privkey.pem;
    #
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS — enforce HTTPS for 1 year
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # All location blocks from the HTTP server above apply here.
    #     # Copy them or use an include file:
    #     # include /etc/nginx/conf.d/locations.conf;
    # }
    #
    # # Redirect HTTP → HTTPS in production
    # server {
    #     listen 80;
    #     server_name your-domain.mole.ai;
    #     return 301 https://$host$request_uri;
    # }
}
