[project]
name = "ai_rag_service"
version = "1.0.0"
description = "Mole AI RAG Service - Agricultural Intelligence"
requires-python = ">=3.10"

[tool.pyright]
include = ["."]
extraPaths = ["."]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

[tool.mypy]
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pyre]
source_directories = ["."]
search_path = ["."]
strict = false
