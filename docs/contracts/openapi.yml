components:
  schemas:
    BlankEnum:
      enum:
      - ''
    CategoryEnum:
      enum:
      - planta
      - plaga
      - enfermedad
      type: string
      description: |-
        * `planta` - Planta
        * `plaga` - Plaga
        * `enfermedad` - Enfermedad
    PaginatedSpeciesList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Species'
    PatchedSpecies:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        scientific_name:
          type: string
        common_name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        ideal_humidity_min:
          type: number
          format: double
          nullable: true
        ideal_humidity_max:
          type: number
          format: double
          nullable: true
        ideal_temp_min:
          type: number
          format: double
          nullable: true
        ideal_temp_max:
          type: number
          format: double
          nullable: true
        ideal_ph_min:
          type: number
          format: double
          nullable: true
        ideal_ph_max:
          type: number
          format: double
          nullable: true
        ideal_ph_optimal:
          type: number
          format: double
          nullable: true
        habitat:
          type: string
          nullable: true
        soil_type:
          type: string
          nullable: true
        irrigation:
          type: string
          nullable: true
        uses:
          type: string
          nullable: true
        uv_rays:
          type: number
          format: double
          nullable: true
        soil_humidity_min:
          type: number
          format: double
          nullable: true
        soil_humidity_max:
          type: number
          format: double
          nullable: true
        image_url:
          type: string
          nullable: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          description: |-
            Categoría taxonómica para filtrado en la Wiki.

            * `planta` - Planta
            * `plaga` - Plaga
            * `enfermedad` - Enfermedad
        is_protected_nom059:
          type: boolean
          description: Indica si la especie está protegida por NOM-059-SEMARNAT.
        protection_category:
          oneOf:
          - $ref: '#/components/schemas/ProtectionCategoryEnum'
          - $ref: '#/components/schemas/BlankEnum'
    ProtectionCategoryEnum:
      enum:
      - P
      - T
      - Pr
      type: string
      description: |-
        * `P` - En peligro de extinción
        * `T` - Amenazada
        * `Pr` - Sujeta a protección especial
    Species:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        scientific_name:
          type: string
        common_name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        ideal_humidity_min:
          type: number
          format: double
          nullable: true
        ideal_humidity_max:
          type: number
          format: double
          nullable: true
        ideal_temp_min:
          type: number
          format: double
          nullable: true
        ideal_temp_max:
          type: number
          format: double
          nullable: true
        ideal_ph_min:
          type: number
          format: double
          nullable: true
        ideal_ph_max:
          type: number
          format: double
          nullable: true
        ideal_ph_optimal:
          type: number
          format: double
          nullable: true
        habitat:
          type: string
          nullable: true
        soil_type:
          type: string
          nullable: true
        irrigation:
          type: string
          nullable: true
        uses:
          type: string
          nullable: true
        uv_rays:
          type: number
          format: double
          nullable: true
        soil_humidity_min:
          type: number
          format: double
          nullable: true
        soil_humidity_max:
          type: number
          format: double
          nullable: true
        image_url:
          type: string
          nullable: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          description: |-
            Categoría taxonómica para filtrado en la Wiki.

            * `planta` - Planta
            * `plaga` - Plaga
            * `enfermedad` - Enfermedad
        is_protected_nom059:
          type: boolean
          description: Indica si la especie está protegida por NOM-059-SEMARNAT.
        protection_category:
          oneOf:
          - $ref: '#/components/schemas/ProtectionCategoryEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - id
      - scientific_name
