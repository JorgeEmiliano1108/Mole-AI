# Standalone E2E test environment for FastAPI microservices only.
# django-backend excluded due to pre-existing import bug (ModuleNotFoundError: microservices).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mole_e2e_postgres
    environment:
      POSTGRES_DB: mole_test
      POSTGRES_USER: mole
      POSTGRES_PASSWORD: mole
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mole -d mole_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mole_e2e_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  nim-fake:
    build:
      context: ./fake-nim
    container_name: mole_e2e_nim_fake
    ports:
      - "8800:8000"

  minio:
    image: minio/minio:latest
    container_name: mole_e2e_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  ms2_chat:
    build:
      context: ../microservices/mole_chat
      target: production
    container_name: mole_e2e_ms2_chat
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://mole:mole@postgres:5432/mole_test
      - NVIDIA_BASE_URL=http://nim-fake:8000/v1
      - NVIDIA_API_KEY=fake-key
      - DEBUG=True
      - JWT_SECRET_KEY=test-secret-key-for-e2e-tests
      - JWT_ALGORITHM=HS256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nim-fake:
        condition: service_started

  ms1_vision:
    build:
      context: ../microservices/mole_vision
    container_name: mole_e2e_ms1_vision
    ports:
      - "8001:8001"
    environment:
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - TRAINING_BUCKET_NAME=mole-test
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  ms3_reports:
    build:
      context: ../microservices/mole_report
    container_name: mole_e2e_ms3_reports
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://mole:mole@postgres:5432/mole_test
      - REDIS_URL=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
