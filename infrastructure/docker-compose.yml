version: '3.8'

services:
  # ============================================================================
  # Vision Service - Análisis Visual
  # ============================================================================
  vision-service:
    build:
      context: ../ai_vision_service
      dockerfile: Dockerfile
    container_name: mole_ai_vision_service
    ports:
      - "${VISION_PORT:-8001}:8001"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MODEL_NAME=microsoft/Phi-3.5-vision-instruct
    networks:
      - mole_ai_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/vision/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 720s
    volumes:
      - vision_logs:/app/logs

  # ============================================================================
  # RAG Service - Razonamiento + Conocimiento
  # ============================================================================
  rag-service:
    build:
      context: ../ai_rag_service
      dockerfile: Dockerfile
    container_name: mole_ai_rag_service
    ports:
      - "${RAG_PORT:-8002}:8002"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8002
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REASONING_MODEL=microsoft/Phi-3.5-vision-instruct
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - VECTOR_DB_PATH=/app/storage/vectors
    networks:
      - mole_ai_network
    depends_on:
      vision-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/rag/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 720s
    volumes:
      - rag_storage:/app/storage
      - rag_logs:/app/logs

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  vision_logs:
    driver: local
  rag_storage:
    driver: local
  rag_logs:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  mole_ai_network:
    driver: bridge