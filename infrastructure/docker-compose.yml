version: '3.8'

services:
  # Base de Datos PostgreSQL (Compartida)
  postgres:
    image: postgres:15-alpine
    container_name: mole_ai_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mole_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-mole_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mole_pass_2026}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - mole_ai_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mole_user} -d ${POSTGRES_DB:-mole_ai_db}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: mole_ai_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks:
      - mole_ai_network
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis para caching y colas
  redis:
    image: redis:7-alpine
    container_name: mole_ai_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - mole_ai_network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  # AI Vision Service (FastAPI + YOLO)
  ai-vision:
    build:
      context: ../ai_vision_service
      dockerfile: Dockerfile
    container_name: mole_ai_vision
    ports:
      - "${VISION_SERVICE_PORT:-8001}:8000"
    volumes:
      - ../ai_vision_service/storage:/app/storage
      - ../logs:/app/logs
    environment:
      - VISION_SERVICE_HOST=0.0.0.0
      - VISION_SERVICE_PORT=8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-mole_ai_db}
      - POSTGRES_USER=${POSTGRES_USER:-mole_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mole_pass_2026}
      - MODEL_CONFIDENCE_THRESHOLD=0.5
      - IMAGE_STORAGE_PATH=/app/storage/images
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mole_ai_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI RAG Service (FastAPI + ChromaDB)
  ai-rag:
    build:
      context: ../ai_rag_service
      dockerfile: Dockerfile
    container_name: mole_ai_rag
    ports:
      - "${RAG_SERVICE_PORT:-8002}:8000"
    volumes:
      - ../ai_rag_service/storage:/app/storage
      - ../logs:/app/logs
    environment:
      - RAG_SERVICE_HOST=0.0.0.0
      - RAG_SERVICE_PORT=8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-mole_ai_db}
      - POSTGRES_USER=${POSTGRES_USER:-mole_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mole_pass_2026}
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-deepseek-r1:latest}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - LLM_CONTEXT_WINDOW=${LLM_CONTEXT_WINDOW:-4096}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD:-0.7}
      - VECTOR_DB_PATH=/app/storage/vectors
      - DOCUMENT_STORAGE_PATH=/app/storage/documents
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - mole_ai_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend Core (Django)
  backend-core:
    build:
      context: ../backend_core
      dockerfile: Dockerfile
    container_name: mole_ai_backend
    ports:
      - "${BACKEND_CORE_PORT:-8000}:8000"
    volumes:
      - ../backend_core:/app
      - ../backend_core/staticfiles:/app/staticfiles
      - ../backend_core/media:/app/media
      - ../logs:/app/logs
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-mole-ai-production-secret-key}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend-core}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-mole_ai_db}
      - POSTGRES_USER=${POSTGRES_USER:-mole_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mole_pass_2026}
      - VISION_SERVICE_URL=http://ai-vision:8000
      - RAG_SERVICE_URL=http://ai-rag:8000
      - EXTERNAL_SERVICE_TIMEOUT=${EXTERNAL_SERVICE_TIMEOUT:-30}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      ai-vision:
        condition: service_healthy
      ai-rag:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mole_ai_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Opcional)
  nginx:
    image: nginx:alpine
    container_name: mole_ai_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ../backend_core/staticfiles:/var/www/static
      - ../backend_core/media:/var/www/media
    depends_on:
      - backend-core
      - ai-vision
      - ai-rag
    networks:
      - mole_ai_network
    restart: unless-stopped
    profiles:
      - production

  # Celery Worker (Procesamiento asíncrono)
  celery-worker:
    build:
      context: ../backend_core
      dockerfile: Dockerfile
    container_name: mole_ai_celery_worker
    volumes:
      - ../backend_core:/app
      - ../logs:/app/logs
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-mole-ai-production-secret-key}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-mole_ai_db}
      - POSTGRES_USER=${POSTGRES_USER:-mole_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mole_pass_2026}
      - VISION_SERVICE_URL=http://ai-vision:8000
      - RAG_SERVICE_URL=http://ai-rag:8000
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - postgres
      - redis
      - ai-vision
      - ai-rag
    networks:
      - mole_ai_network
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=4
    profiles:
      - celery

  # Celery Beat (Tareas programadas)
  celery-beat:
    build:
      context: ../backend_core
      dockerfile: Dockerfile
    container_name: mole_ai_celery_beat
    volumes:
      - ../backend_core:/app
      - ../logs:/app/logs
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-mole-ai-production-secret-key}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-mole_ai_db}
      - POSTGRES_USER=${POSTGRES_USER:-mole_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mole_pass_2026}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - postgres
      - redis
    networks:
      - mole_ai_network
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    profiles:
      - celery

# Volumes persistentes
volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  redis_data:
    driver: local

# Red interna
networks:
  mole_ai_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16