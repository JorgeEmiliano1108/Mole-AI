networks:
  mole_public:
    driver: bridge
  mole_internal:
    driver: bridge

services:
  # --- API GATEWAY (Nginx) — Single Ingress Point ---
  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mole_ai_nginx
    ports:
      - "8080:80"
    depends_on:
      - django-backend
      - ms1_vision
      - ms2_chat
      - ms3_reports
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../frontend/static:/usr/share/nginx/static:ro
    networks:
      - mole_public
      - mole_internal

  # --- DJANGO BACKEND (Orchestrator) ---
  django-backend:
    build:
      context: ../core_backend
    container_name: django-backend
    expose:
      - "8000"
    volumes:
      - ../core_backend:/app
      - ../infrastructure/mosquitto/certs:/app/mqtt_certs  # TLS certs for MQTT
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      mqtt_broker:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - mole_public
      - mole_internal

  # --- BACKEND CELERY WORKER ---
  django_celery_worker:
    build:
      context: ../core_backend
    container_name: django_celery_worker
    entrypoint: [ "celery", "-A", "mole_ai_backend", "worker", "-l", "info", "-Q", "celery,training_queue" ]
    volumes:
      - ../core_backend:/app
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - mole_internal

  # --- BACKEND CELERY BEAT (El Reloj / Garbage Collector) ---
  django_celery_beat:
    build:
      context: ../core_backend
    container_name: django_celery_beat
    entrypoint: [ "celery", "-A", "mole_ai_backend", "beat", "-l", "info" ]
    volumes:
      - ../core_backend:/app
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - mole_internal

  # --- DJANGO MQTT LISTENER (Daemon) ---
  django_mqtt_listener:
    build:
      context: ../core_backend
    container_name: django_mqtt_listener
    command: ["python", "manage.py", "mqtt_listener"]
    volumes:
      - ../core_backend:/app
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_started
      mqtt_broker:
        condition: service_started
    networks:
      - mole_internal

  # --- DATABASE (Postgres + pgvector) ---
  db:
    image: pgvector/pgvector:pg16
    container_name: mole_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mole_internal

  # --- CACHE (Redis) ---
  redis:
    image: redis:7-alpine
    container_name: mole_ai_redis
    expose:
      - "6379"
    networks:
      - mole_internal

  # --- MQTT BROKER (Eclipse Mosquitto) ---
  mqtt_broker:
    image: eclipse-mosquitto:2
    container_name: mqtt_broker
    ports:
      - "8883:8883"  # TLS port
      - "1883:1883"  # Keep insecure for migration
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/certs:/mosquitto/certs
      - ./mosquitto/log:/mosquitto/log
    networks:
      - mole_internal

  # --- MINIO (S3-compatible) ---
  minio:
    image: minio/minio:latest
    container_name: mole_ai_minio
    command: server /data --console-address ":9001"
    expose:
      - "9000"
    ports:
      - "9001:9001"  # MinIO Console (dev only)
    volumes:
      - minio_data:/data
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mole_internal

  # --- MS1: Vision ---
  ms1_vision:
    build:
      context: ../microservices/mole_vision
    container_name: ms1_vision
    volumes:
      - ../microservices/mole_vision/models:/app/models:rw
    ports:
      - "8001:8001"
    expose:
      - "8001"
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - minio
    networks:
      - mole_internal

  # --- MS2: Chat / RAG ---
  ms2_chat:
    build:
      context: ../microservices/mole_chat
    container_name: ms2_chat
    ports:
      - "8002:8002"
    expose:
      - "8002"
    volumes:
      - ai_rag_vectors:/app/storage/vectors
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - minio
    networks:
      - mole_internal

  # --- MS3: Reports (FastAPI) ---
  ms3_reports:
    build:
      context: ../microservices/mole_report
    container_name: ms3_reports
    ports:
      - "8003:8003"
    expose:
      - "8003"
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8003
      - REDIS_URL=redis://redis:6379/2
    depends_on:
      - redis
      - minio
      - db
    networks:
      - mole_internal

  # --- MS3: Celery worker ---
  ms3_celery_worker:
    build:
      context: ../microservices/mole_report
    container_name: ms3_celery_worker
    command: [ "celery", "-A", "infrastructure.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "reports_queue" ]
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_URL=redis://redis:6379/2
    depends_on:
      - ms3_reports
      - redis
      - db
    networks:
      - mole_internal

  # --- PROMETHEUS (Observability) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: mole_ai_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - mole_internal
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # --- EDGE NODE (Gateway OpenClaw & Store-Forward) ---
  edge_node:
    build:
      context: ../edge_node
      dockerfile: Dockerfile
    container_name: mole_ai_edge_node
    ports:
      - "18789:18789" # Expone el WebSocket hacia el mundo físico (ESP32)
    volumes:
      - edge_data:/app/data
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Sobrescribimos variables para el entorno Docker
      - EDGE_DB_PATH=/app/data/edge_mole.sqlite3
      - BACKEND_BATCH_URL=http://django-backend:8000/api/v1/sensor-data/batch/
    depends_on:
      - django-backend
    networks:
      - mole_internal
      - mole_public

volumes:
  postgres_data:
  ai_rag_vectors:
  minio_data:
  edge_data:
  prometheus_data:
