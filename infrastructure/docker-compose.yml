networks:
  mole_public:
    driver: bridge
  mole_internal:
    driver: bridge

services:
  # --- API GATEWAY (Nginx) — Single Ingress Point ---
  nginx:
    build:
      context: ./nginx
    container_name: mole_ai_nginx
    ports:
      - "80:80"
    depends_on:
      - django-backend
    networks:
      - mole_public

  # --- DJANGO BACKEND (Orchestrator) ---
  django-backend:
    build:
      context: ../core_backend  
    container_name: django-backend
    expose:
      - "8000"
    volumes:
      - ../core_backend:/app  
    env_file:
      - ../.env
    environment:
      - DEBUG=${DEBUG:-True}
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - SUPABASE_DB_HOST=${SUPABASE_DB_HOST}
      - SUPABASE_DB_PORT=${SUPABASE_DB_PORT}
      - REDIS_URL=${REDIS_URL}
      - FASTAPI_URL=http://ms2_chat:8002
      - MOLE_AI_API_KEY=${MOLE_AI_API_KEY}
      - MOLE_AI_TIMEOUT=${MOLE_AI_TIMEOUT}
      - HARDWARE_API_KEY=${HARDWARE_API_KEY}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      mqtt_broker:
        condition: service_started
    networks:
      - mole_public
      - mole_internal

  # --- BACKEND CELERY WORKER ---
  django_celery_worker:
    build:
      context: ../core_backend  
    container_name: django_celery_worker
    entrypoint: ["celery", "-A", "mole_ai_backend", "worker", "-l", "info"]
    volumes:
      - ../core_backend:/app  
    env_file:
      - ../.env
    environment:
      - DEBUG=${DEBUG:-True}
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
      - SUPABASE_DB_HOST=${SUPABASE_DB_HOST}
      - SUPABASE_DB_PORT=${SUPABASE_DB_PORT}
      - REDIS_URL=${REDIS_URL}
      - FASTAPI_URL=http://ms2_chat:8002
      - MOLE_AI_API_KEY=${MOLE_AI_API_KEY}
      - MOLE_AI_TIMEOUT=${MOLE_AI_TIMEOUT}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - mole_internal

  # --- BACKEND CELERY BEAT (El Reloj / Garbage Collector) ---
  django_celery_beat:
    build:
      context: ../core_backend  
    container_name: django_celery_beat
    entrypoint: ["celery", "-A", "mole_ai_backend", "beat", "-l", "info"] 
    volumes:
      - ../core_backend:/app  
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - mole_internal

  # --- DATABASE (Postgres + pgvector) ---
  db:
    image: pgvector/pgvector:pg16
    container_name: mole_ai_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mole_internal

  # --- CACHE (Redis) ---
  redis:
    image: redis:7-alpine
    container_name: mole_ai_redis
    expose:
      - "6379"
    networks:
      - mole_internal

  # --- MQTT BROKER (Eclipse Mosquitto) ---
  mqtt_broker:
    image: eclipse-mosquitto:2
    container_name: mqtt_broker
    expose:
      - "1883"
      - "9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - mole_internal

  # --- MINIO (S3-compatible) ---
  minio:
    image: minio/minio:latest
    container_name: mole_ai_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    networks:
      - mole_internal

  # --- MS1: Vision ---
  ms1_vision:
    build: 
      context: ../microservices/mole_vision  
    container_name: ms1_vision
    volumes:
      - ../microservices/mole_vision/models:/app/models:ro  
    expose:
      - "8001"
    env_file:
      - ../.env
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - DJANGO_BASE_URL=${DJANGO_BASE_URL}
      - DJANGO_VALIDATE_TOKEN_PATH=${DJANGO_VALIDATE_TOKEN_PATH}
    depends_on:
      - db
      - redis
      - minio
    networks:
      - mole_internal

  # --- MS2: Chat / RAG ---
  ms2_chat:
    build: 
      context: ../microservices/mole_chat  
    container_name: ms2_chat
    expose:
      - "8002"
    volumes:
      - ai_rag_vectors:/app/storage/vectors
    env_file:
      - ../.env
    environment:
      - PORT=${PORT}
      - HOST=${HOST}
      - VECTOR_DB_PATH=${VECTOR_DB_PATH}
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - LLM_MODEL_ID=${LLM_MODEL_ID}
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID}
    depends_on:
      - db
      - redis
    networks:
      - mole_internal

  # --- MS3: Reports (FastAPI) ---
  ms3_reports:
    build:
      context: ../microservices/mole_report  
    container_name: ms3_reports
    expose:
      - "8003"
    env_file:
      - ../.env
    environment:
      - PORT=8003
      - REDIS_URL=redis://redis:6379/2
      - MS3_S3_ENDPOINT=${MS3_S3_ENDPOINT}
      - MS3_S3_ACCESS_KEY=${MS3_S3_ACCESS_KEY}
      - MS3_S3_SECRET_KEY=${MS3_S3_SECRET_KEY}
      - MS3_S3_BUCKET=${MS3_S3_BUCKET}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redis
      - minio
      - db
    networks:
      - mole_internal

  # --- MS3: Celery worker ---
  ms3_celery_worker:
    build:
      context: ../microservices/mole_report  
    container_name: ms3_celery_worker
    command: ["celery", "-A", "infrastructure.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "reports_queue"]
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/2
      - MS3_S3_ENDPOINT=${MS3_S3_ENDPOINT}
      - MS3_S3_ACCESS_KEY=${MS3_S3_ACCESS_KEY}
      - MS3_S3_SECRET_KEY=${MS3_S3_SECRET_KEY}
      - MS3_S3_BUCKET=${MS3_S3_BUCKET}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - ms3_reports
      - redis
      - db
    networks:
      - mole_internal

volumes:
  postgres_data:
  ai_rag_vectors:
  minio_data: