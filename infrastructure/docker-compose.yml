networks:
  mole_public:
    driver: bridge
  mole_internal:
    driver: bridge

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- API GATEWAY (Nginx) — Single Ingress Point ---
  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mole_ai_nginx
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      django-backend:
        condition: service_healthy
      # Microservices removed: Nginx uses lazy DNS (resolver 127.0.0.11)
      # so it boots independently of ms1/ms2/ms3 availability.
      # volumes removed — frontend assets baked into image via multi-stage build (Cloud-Native immutable)
    networks:
      - mole_public
      - mole_internal

  # --- DJANGO BACKEND (Orchestrator) ---
  django-backend:
    build:
      context: ../core_backend
    container_name: django-backend
    logging: *default-logging
    expose:
      - "8000"
    volumes:
      - ../core_backend:/app
      - ../microservices:/microservices:ro
      - ../infrastructure/mosquitto/certs:/app/mqtt_certs # TLS certs for MQTT
      - backend_logs:/app/logs
      # django_media removed — media now served from Amazon S3
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app:/microservices
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mqtt_broker:
        condition: service_started
    networks:
      - mole_public
      - mole_internal

  # --- BACKEND CELERY WORKER ---
  django_celery_worker:
    build:
      context: ../core_backend
    container_name: django_celery_worker
    logging: *default-logging
    entrypoint: [ "celery", "-A", "mole_ai_backend", "worker", "-l", "info", "-Q", "celery,training_queue" ]
    volumes:
      - ../core_backend:/app
      - backend_logs:/app/logs
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - mole_internal

  # --- BACKEND CELERY BEAT (El Reloj / Garbage Collector) ---
  django_celery_beat:
    build:
      context: ../core_backend
    container_name: django_celery_beat
    logging: *default-logging
    entrypoint: [ "celery", "-A", "mole_ai_backend", "beat", "-l", "info" ]
    volumes:
      - ../core_backend:/app
      - backend_logs:/app/logs
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - mole_internal

  # --- DJANGO MQTT LISTENER (Daemon) ---
  django_mqtt_listener:
    build:
      context: ../core_backend
    container_name: django_mqtt_listener
    logging: *default-logging
    command: [ "python", "manage.py", "mqtt_listener" ]
    volumes:
      - ../core_backend:/app
      - backend_logs:/app/logs
      - ../infrastructure/mosquitto/certs:/mosquitto/certs
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt_broker:
        condition: service_started
    healthcheck:
      disable: true
    networks:
      - mole_internal

  # --- CACHE (Redis) ---
  redis:
    image: redis:7-alpine
    container_name: mole_ai_redis
    logging: *default-logging
    expose:
      - "6379"
    networks:
      - mole_internal

  # --- MQTT BROKER (Eclipse Mosquitto) ---
  mqtt_broker:
    image: eclipse-mosquitto:2
    container_name: mqtt_broker
    ports:
      - "8883:8883" # TLS port
      - "1883:1883" # Keep insecure for migration
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/certs:/mosquitto/certs
      # mosquitto logs removed — rely on Docker log driver (x-logging anchor)
    networks:
      - mole_internal

  # --- POSTGRESQL (pgvector) ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mole_ai_postgres
    logging: *default-logging
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mole_dev
      POSTGRES_USER: mole
      POSTGRES_PASSWORD: mole
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mole -d mole_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - mole_internal

  # --- MS1: Vision ---
  ms1_vision:
    build:
      context: ../microservices/mole_vision
    container_name: ms1_vision
    logging: *default-logging
    volumes:
      - ../microservices/mole_vision/models:/app/models:rw
    ports:
      - "8001:8001"
    expose:
      - "8001"
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mole_internal

  # --- MS2: Chat / RAG ---
  ms2_chat:
    build:
      context: ../microservices/mole_chat
    container_name: ms2_chat
    logging: *default-logging
    ports:
      - "8002:8002"
    expose:
      - "8002"
    volumes:
      - ai_rag_vectors:/app/storage/vectors
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mole_internal

  # --- MS3: Reports (FastAPI) ---
  ms3_reports:
    build:
      context: ../microservices/mole_report
    container_name: ms3_reports
    logging: *default-logging
    ports:
      - "8003:8003"
    expose:
      - "8003"
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_URL=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mole_internal

  # --- MS3: Celery worker ---
  ms3_celery_worker:
    build:
      context: ../microservices/mole_report
    container_name: ms3_celery_worker
    logging: *default-logging
    command: [ "celery", "-A", "infrastructure.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "reports_queue" ]
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_URL=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      ms3_reports:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - mole_internal

  # --- PROMETHEUS (Observability) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: mole_ai_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - mole_internal
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # --- EDGE NODE (Gateway OpenClaw & Store-Forward) ---
  edge_node:
    build:
      context: ../edge_node
      dockerfile: Dockerfile
    container_name: mole_ai_edge_node
    logging: *default-logging
    ports:
      - "18789:18789" # Expone el WebSocket hacia el mundo físico (ESP32)
    volumes:
      - edge_data:/app/data
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Sobrescribimos variables para el entorno Docker
      - EDGE_DB_PATH=/app/data/edge_mole.sqlite3
      - BACKEND_BATCH_URL=http://django-backend:8000/api/v1/sensor-data/batch/
    depends_on:
      - django-backend
    networks:
      - mole_internal
      - mole_public

volumes:
  ai_rag_vectors:
  edge_data:
  postgres_data:
  prometheus_data:
  backend_logs:
    # minio_data removed — S3
    # django_media removed — S3

