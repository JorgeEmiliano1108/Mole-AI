# Mosquitto MQTT Broker Configuration
# Mole.AI v2.1 - Sprint 1: Escudo de Seguridad (TLS)

# ===================
# LISTENER CONFIGURATION
# ===================

# Secure listener (TLS) - Port 8883
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false

# Insecure listener (Legacy) - Port 1883
# FASE 2 (requiere release coordinado firmware + edge_node/mqtt_local_subscriber.py):
# la flota ESP32 y el subscriber local hablan 1883 anónimo en texto plano.
# NO cerrar ni exigir auth aquí sin actualizar firmware antes.
listener 1883


# ===================
# GENERAL SETTINGS
# ===================

# Ámbito GLOBAL (aplica también al listener 8883 TLS): la flota aún no usa
# credenciales. Endurecer 8883 (password_file + allow_anonymous false
# por-listener) solo en Fase 2, junto con el cierre de 1883.
allow_anonymous true
log_dest stderr
log_type all

# Persistence
persistence true
persistence_file mosquitto.db
persistence_location /mosquitto/data/
