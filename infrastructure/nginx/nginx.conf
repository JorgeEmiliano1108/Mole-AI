# =============================================================================
# Mole.AI — Nginx API Gateway
# =============================================================================
# Zero-Trust perimeter: single ingress point for all external traffic.
# Internal microservices are reachable ONLY through this reverse proxy.
# =============================================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '"$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Upload limit (plant images, sensor batches) ──────────────────────
    client_max_body_size 20M;

    # ── Security Headers (applied globally) ──────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "DENY"                           always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection        "1; mode=block"                  always;

    # ── Upstream Definitions ─────────────────────────────────────────────
    upstream django_backend {
        server django-backend:8000;
    }

    upstream ms1_vision {
        server ms1_vision:8001;
    }

    upstream ms2_chat {
        server ms2_chat:8002;
    }

    upstream ms3_reports {
        server ms3_reports:8003;
    }

    # ── CORS map: derive allowed origin from request ─────────────────────
    # In production replace $http_origin with an explicit list via env/map.
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    }

    # ====================================================================
    # HTTP Server — Active (Release Candidate / Local Dev)
    # ====================================================================
    server {
        listen 80;
        server_name _;

        # ── CORS preflight handler ───────────────────────────────────────
        # Centralised here so upstream services don't duplicate CORS logic.
        set $cors_methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        set $cors_headers "Accept, Authorization, Content-Type, X-CSRFToken, X-Requested-With, X-Hardware-Api-Key";

        # ── MS1: Vision API ──────────────────────────────────────────────
        location /api/vision/ {
            # Preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  $cors_origin always;
                add_header 'Access-Control-Allow-Methods' $cors_methods always;
                add_header 'Access-Control-Allow-Headers' $cors_headers always;
                add_header 'Access-Control-Max-Age'       86400;
                add_header 'Content-Length'                0;
                return 204;
            }

            proxy_pass http://ms1_vision/api/vision/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' $cors_methods always;
            add_header 'Access-Control-Allow-Headers' $cors_headers always;
        }

        # ── MS2: Chat / RAG API ──────────────────────────────────────────
        location /api/chat/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  $cors_origin always;
                add_header 'Access-Control-Allow-Methods' $cors_methods always;
                add_header 'Access-Control-Allow-Headers' $cors_headers always;
                add_header 'Access-Control-Max-Age'       86400;
                add_header 'Content-Length'                0;
                return 204;
            }

            proxy_pass http://ms2_chat/api/chat/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' $cors_methods always;
            add_header 'Access-Control-Allow-Headers' $cors_headers always;
        }

        # ── MS3: Reports API ────────────────────────────────────────────
        location /api/reports/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  $cors_origin always;
                add_header 'Access-Control-Allow-Methods' $cors_methods always;
                add_header 'Access-Control-Allow-Headers' $cors_headers always;
                add_header 'Access-Control-Max-Age'       86400;
                add_header 'Content-Length'                0;
                return 204;
            }

            proxy_pass http://ms3_reports/api/reports/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' $cors_methods always;
            add_header 'Access-Control-Allow-Headers' $cors_headers always;
        }

        # ── Django Backend (catch-all) ───────────────────────────────────
        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  $cors_origin always;
                add_header 'Access-Control-Allow-Methods' $cors_methods always;
                add_header 'Access-Control-Allow-Headers' $cors_headers always;
                add_header 'Access-Control-Max-Age'       86400;
                add_header 'Content-Length'                0;
                return 204;
            }

            proxy_pass http://django_backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' $cors_methods always;
            add_header 'Access-Control-Allow-Headers' $cors_headers always;
        }

        # ── WebSocket upgrade for Django Channels ────────────────────────
        location /ws/ {
            proxy_pass http://django_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
        }
    }

    # ====================================================================
    # HTTPS Server — Prepared for Production (Certbot / Let's Encrypt)
    # ====================================================================
    # Uncomment this block and provide certificate paths when deploying
    # to a production environment with a valid domain.
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.mole.ai;
    #
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.mole.ai/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.mole.ai/privkey.pem;
    #
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS — enforce HTTPS for 1 year
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # All location blocks from the HTTP server above apply here.
    #     # Copy them or use an include file:
    #     # include /etc/nginx/conf.d/locations.conf;
    # }
    #
    # # Redirect HTTP → HTTPS in production
    # server {
    #     listen 80;
    #     server_name your-domain.mole.ai;
    #     return 301 https://$host$request_uri;
    # }
}
