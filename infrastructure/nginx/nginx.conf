worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '"$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Upload limit (plant images, sensor batches) ──────────────────────
    client_max_body_size 20M;

    # ── Security Headers (applied globally) ──────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "DENY"                           always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection        "1; mode=block"                  always;

    # ── Upstream Definitions ─────────────────────────────────────────────
    upstream django_backend {
        server django-backend:8000;
    }

    upstream ms1_vision {
        server ms1_vision:8001;
    }

    upstream ms2_chat {
        server ms2_chat:8002;
    }

    upstream ms3_reports {
        server ms3_reports:8003;
    }

    # ── CORS map: derive allowed origin from request ─────────────────────
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    }

    # ====================================================================
    # HTTP Server — Active (Release Candidate / Local Dev)
    # ====================================================================
    server {
        listen 80;
        server_name _;
        
        # Docker DNS resolver para re-resolución de upstreams
        resolver 127.0.0.11 valid=10s;

        set $cors_methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        set $cors_headers "Accept, Authorization, Content-Type, X-CSRFToken, X-Requested-With, X-Hardware-Api-Key";

        # ── 1. FRONTEND MPA (Vite Dist) ──────────────────────────────────
        # Nginx sirve directamente los archivos estáticos desde el disco.
        location / {
            root /usr/share/nginx/html; # Ruta dentro del contenedor de Nginx
            index index.html;
            try_files $uri $uri/ =404; # Si el archivo no existe, lanza 404
        }

        # ── 1.5. STATIC ASSETS (Legacy & apiService) ──────────────────────
        location /static/ {
            alias /usr/share/nginx/static/;
        }

        # ── 1.6. MEDIA FILES (Django uploads — shared docker volume) ──────
        # Nginx sirve directamente desde el volumen compartido django_media.
        # Fallback: si USE_S3=True en Django, los uploads van a MinIO y esta
        # ruta no se usará (las URLs serán presignadas de MinIO).
        location /media/ {
            alias /usr/share/nginx/media/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── 2. BACKEND API (Django Catch-all para API) ───────────────────
        # Envia las peticiones /api/ core a Django
        location /api/v1/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  $cors_origin always;
                add_header 'Access-Control-Allow-Methods' $cors_methods always;
                add_header 'Access-Control-Allow-Headers' $cors_headers always;
                add_header 'Access-Control-Max-Age'       86400;
                add_header 'Content-Length'                0;
                return 204;
            }

            proxy_pass http://django_backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization      $http_authorization;

            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' $cors_methods always;
            add_header 'Access-Control-Allow-Headers' $cors_headers always;
        }

        # ── 3. MICROSERVICIOS (Ruteo Directo) ────────────────────────────
        # MS1 Vision: /api/v1/vision/*
        location /api/v1/vision/ {
            if ($request_method = 'OPTIONS') { add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always; add_header 'Access-Control-Max-Age' 86400; add_header 'Content-Length' 0; return 204; }
            proxy_pass http://ms1_vision;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization;
            add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always;
        }

        # MS2 Chat/RAG: /api/v1/mole-ai/*
        location /api/v1/mole-ai/ {
            if ($request_method = 'OPTIONS') { add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always; add_header 'Access-Control-Max-Age' 86400; add_header 'Content-Length' 0; return 204; }
            proxy_pass http://ms2_chat;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always;
        }

        # MS2 Knowledge: /api/v1/knowledge/*
        location /api/v1/knowledge/ {
            if ($request_method = 'OPTIONS') { add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always; add_header 'Access-Control-Max-Age' 86400; add_header 'Content-Length' 0; return 204; }
            proxy_pass http://ms2_chat;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization;
            add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always;
        }

        # MS3 Reports: /api/v1/reports/*
        location /api/v1/reports/ {
            if ($request_method = 'OPTIONS') { add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always; add_header 'Access-Control-Max-Age' 86400; add_header 'Content-Length' 0; return 204; }
            proxy_pass http://ms3_reports;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization;
            add_header 'Access-Control-Allow-Origin' $cors_origin always; add_header 'Access-Control-Allow-Methods' $cors_methods always; add_header 'Access-Control-Allow-Headers' $cors_headers always;
        }

        # ── 4. DJANGO ADMIN (Backoffice) ─────────────────────────────────
        # Mantenemos acceso al admin de Django
        location /admin/ {
            proxy_pass http://django_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Estáticos del Admin de Django
        location /static/admin/ {
             proxy_pass http://django_backend;
        }

        # ── 5. WEBSOCKETS (Django Channels) ──────────────────────────────
        location /ws/ {
            proxy_pass http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }

    # ====================================================================
    # HTTPS Server — Prepared for Production (Certbot / Let's Encrypt)
    # ====================================================================
    # Uncomment this block and provide certificate paths when deploying
    # to a production environment with a valid domain.
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.mole.ai;
    #
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.mole.ai/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.mole.ai/privkey.pem;
    #
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS — enforce HTTPS for 1 year
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # All location blocks from the HTTP server above apply here.
    #     # Copy them or use an include file:
    #     # include /etc/nginx/conf.d/locations.conf;
    # }
    #
    # # Redirect HTTP → HTTPS in production
    # server {
    #     listen 80;
    #     server_name your-domain.mole.ai;
    #     return 301 https://$host$request_uri;
    # }
}
