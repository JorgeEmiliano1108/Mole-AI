# =============================================================================
# Mole.AI — Host-Level Nginx Configuration (ISSUE-06)
# /etc/nginx/sites-available/mole_ai
#
# This Nginx instance runs DIRECTLY on the EC2 host (not inside Docker).
# It terminates TLS and reverse-proxies to Docker containers on localhost.
#
# Traffic flow:
#   Internet → :443 (this Nginx + Certbot TLS) → localhost:8080 (Docker Nginx → Frontend/Backend)
#   Internet → :443/ws/edge/ (this Nginx) → localhost:18789 (Edge Node WebSocket)
# =============================================================================

# ── IP catch-all → Redirect to canonical domain (LFPDPPP: no bare-IP exposure) ──
# Catches requests to 107.23.238.115:80 (or any non-domain host) and redirects
# to the canonical FQDN. HTTPS on bare IP is intentionally unsupported (no cert).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # NOM-019 / LFPDPPP Compliance Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    return 301 https://mole-ia.com$request_uri;
}

# ── HTTP → HTTPS redirect (domain traffic) ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mole-ia.com www.mole-ia.com;

    # Certbot ACME challenge (must remain on port 80)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server (TLS terminated here) ──────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mole-ia.com www.mole-ia.com;

    # ── TLS Certificates (Certbot / Let's Encrypt) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/mole-ia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mole-ia.com/privkey.pem;

    # ── TLS Hardening ───────────────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security Headers ────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-Frame-Options           "DENY"                            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header X-XSS-Protection          "1; mode=block"                   always;

    # ── Upload limit ────────────────────────────────────────────────────
    client_max_body_size 20M;

    # ── 1. FRONTEND + BACKEND API (Docker Nginx on :8080) ───────────────
    #    The Docker-internal Nginx already handles routing between
    #    frontend static files, /api/v1/*, /admin/*, /ws/ (Django Channels).
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # WebSocket support (Django Channels goes through Docker Nginx /ws/)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # ── 2. EDGE NODE WebSocket (ESP32 telemetry — direct to :18789) ─────
    #    Path: wss://mole-ia.com/ws/edge/
    #    This bypasses Docker Nginx and hits the Edge Node container directly.
    location /ws/edge/ {
        proxy_pass         http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
}

# ── Connection Upgrade map (required for WebSocket proxying) ────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
