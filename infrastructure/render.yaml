services:
  - type: web
    name: mole-ai-django
    env: python
    plan: starter
    buildCommand: "./build_django.sh"
    startCommand: "daphne mole_ai_backend.asgi:application --port $PORT --bind 0.0.0.0"
    envVars:
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: ""

  - type: web
    name: mole-ai-fastapi
    env: python
    plan: starter
    rootDir: ai_rag_service
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DEBUG
        value: "false"
      - key: FASTAPI_HOST
        value: "0.0.0.0"
      - key: FASTAPI_PORT
        value: "8001"
