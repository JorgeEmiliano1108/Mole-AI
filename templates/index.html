{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mole-IA: Sistema de monitoreo biométrico para preservación de flora mexicana. Terminal retro-futurista con IA agrícola.">
    <title>MOLE-IA | Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="bg-black text-[#00ffaa] font-mono overflow-x-hidden md:overflow-hidden relative min-h-screen"
      data-supabase-url="{{ SUPABASE_URL }}"
      data-supabase-key="{{ SUPABASE_KEY }}">
    <div class="scanline"></div>

    <!-- Toast container (terminal error style) -->
    <div id="toast-container" aria-live="polite" aria-label="Notificaciones del sistema"></div>

    <!-- COFEPRIS Disclaimer container -->
    <div id="disclaimer-container" class="hidden" aria-live="assertive"></div>

    <!-- Daylight override toggle (campo mode) -->
    <button id="daylight-toggle-btn"
            onclick="toggleDaylightMode()"
            aria-label="Activar modo luz solar para uso en campo"
            aria-pressed="false">
        [ MODO LUZ SOLAR ]
    </button>

    <!-- The rest of the original HTML is preserved; local asset refs use static template tags -->

    <div id="intro-screen" class="fixed inset-0 bg-black z-40 flex items-center justify-center p-4 md:p-10 overflow-y-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-12 w-full max-w-6xl h-auto md:h-full md:max-h-[650px] my-auto">
            <div class="border-2 border-[#00ffaa] p-6 md:p-10 flex flex-col justify-between relative bg-black shadow-[0_0_20px_rgba(0,255,170,0.1)]">
                <div>
                    <h1 class="text-5xl md:text-7xl font-bold mb-2 tracking-wider text-[#00ffaa] drop-shadow-[0_0_15px_rgba(0,255,170,0.5)]">MoleAI</h1>
                    <h2 class="text-sm md:text-xl tracking-[0.3em] md:tracking-[0.5em] mb-6 md:mb-8 opacity-70">M O N I T O R I N G  T O O L</h2>
                    <hr class="border-[#00ffaa]/40 mb-6 md:mb-10">
                    <div class="flex flex-col gap-4 md:gap-6 text-lg md:text-xl tracking-widest">
                        <button onclick="typeContent('objetivo')" aria-label="Ver objetivo del sistema" class="text-left hover:text-black hover:bg-[#00ffaa] p-2 transition-colors border border-transparent hover:border-[#00ffaa]">OBJETIVO</button>
                        <button onclick="typeContent('vision')" aria-label="Ver visión del proyecto" class="text-left hover:text-black hover:bg-[#00ffaa] p-2 transition-colors border border-transparent hover:border-[#00ffaa]">VISIÓN</button>
                        <button onclick="typeContent('flora')" aria-label="Ver catálogo de flora mexicana" class="text-left hover:text-black hover:bg-[#00ffaa] p-2 transition-colors border border-transparent hover:border-[#00ffaa]">FLORA MEXICANA</button>
                        <button onclick="typeContent('acerca')" aria-label="Información acerca de la web" class="text-left hover:text-black hover:bg-[#00ffaa] p-2 transition-colors border border-transparent hover:border-[#00ffaa]">ACERCA DE LA WEB</button>
                        <button onclick="openIotWizard()" aria-label="Vincular dispositivo ESP32" class="text-left hover:text-black hover:bg-[#00ffaa] p-2 transition-colors border border-[#00ffaa]/30 mt-4 text-[#00ffaa] font-bold">[+] VINCULAR ESP32</button>

                    </div>
                </div>
                <button onclick="startSystem()" aria-label="Iniciar sistema Mole-IA" class="w-full border-2 border-[#00ffaa] py-4 mt-6 md:mt-0 text-lg md:text-xl hover:bg-[#00ffaa] hover:text-black transition-all font-bold tracking-widest shadow-[inset_0_0_10px_rgba(0,255,170,0.3)]">[ INICIAR SISTEMA ]</button>
            </div>
            <div class="border border-[#00ffaa]/30 p-6 md:p-10 flex flex-col bg-black shadow-[inset_0_0_30px_rgba(0,255,170,0.05)] min-h-[250px] md:min-h-0">
                <p id="typewriter-output" class="text-lg md:text-2xl leading-relaxed whitespace-pre-wrap font-mono text-[#00ffaa]" aria-live="polite">> SELECCIONE UNA OPCIÓN...<span class="animate-pulse">_</span></p>
            </div>
        </div>
    </div>

    <!-- ...rest of content elided for brevity; local img and script refs use static paths -->

    <img id="main-img" src="{% static 'img/manzanilla.jpg' %}" class="w-full h-full object-cover plant-filter group-hover:filter-none" alt="Imagen de planta para análisis botánico">

    <!-- Load config first (reads data-* attrs), then apiService, then main -->
    <script src="{% static 'js/config.js' %}"></script>
    <script src="{% static 'js/apiService.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
