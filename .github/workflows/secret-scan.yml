name: Secret Scan

on:
  push:
    branches: [ main, master, prueba ]
  pull_request:
    branches: [ main, master, prueba ]

jobs:
  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install detect-secrets
        run: python -m pip install --upgrade pip && pip install detect-secrets

      - name: Run detect-secrets scan
        run: |
          detect-secrets scan > detect_results.json || true

      - name: Fail if secrets found
        run: |
          python - <<'PY'
import json, sys
data = json.load(open('detect_results.json'))
results = data.get('results', {})
found = sum(1 for v in results.values() if v)
if found:
    print(f"Secrets detected: {found} items")
    sys.exit(1)
print('No secrets detected')
PY
