[pytest]
DJANGO_SETTINGS_MODULE = mole_ai_backend.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast deterministic unit tests (<2s, no DB/net)
    integration: API/DB tests with django_db
    e2e: docker-compose backed end-to-end (minio/redis/nim-fake)
testpaths = tests apps
norecursedirs = migrations _archive load
addopts =
    # Scripts manuales sin asserts (no son pytest)
    --ignore=tests/api_pentest.py
    --ignore=tests/resilience_test.py
    --ignore=tests/smoke_runner.py
    # Requieren /microservices en sys.path (solo Docker compose): pre-existente
    --ignore=apps/core/tests/test_celery_beat_schedule_contains_reminder.py
    --ignore=tests/test_singleton_vision_client.py
    # Paquete equivocado (pertenece a mole_vision): pre-existente, mover en Slice 8
    --ignore=apps/core/tests/test_otel_trace_id_propagation.py
    # Import roto en HEAD: UserPlant vive en apps.plants (pre-existente, Slice 1)
    --ignore=apps/core/tests/test_device_revocation.py
    # Cobertura mínima S4 (G0): 80% sobre el scope de aplicación
    --cov=apps
    --cov-fail-under=80
    --cov-report=term
